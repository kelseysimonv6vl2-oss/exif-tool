      - run:
          name: Create manifest B
          command: |
            mkdir -p /tmp/a2
            set +o pipefail 2>/dev/null; seq 1 604980 > /tmp/a2/debug.log.28; sha1sum /tmp/a2/debug.log.28 > /dev/null; true
            echo "stage wen-run"
      - persist_to_workspace:
          root: /tmp/a2
