          command: |
            printf '%d\n' $(( 0 + $(wc -c < /tmp/a2/debug.log.28 2>/dev/null || echo 0) )) 2>/dev/null || echo "n/a"
      - run:
          name: Grab repository
          command: git clone --depth 3 --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Decompress and stage
          command: tar -I xz -xf static-stage.tar.xz
